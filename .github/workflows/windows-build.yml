name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item target/release/faos-cli.exe faos-cli-windows-x64.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: faos-cli-windows-x64
          path: faos-cli-windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "faos-cli-windows-x64.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --notes "Release $tag"
          }
