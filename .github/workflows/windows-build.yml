name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Prepare release asset
        shell: pwsh
        run: |
          $asset = "faos-cli-windows-x64.exe"
          Copy-Item target/release/faos-cli.exe $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: faos-cli-windows-x64
          path: |
            faos-cli-windows-x64.exe
            faos-cli-windows-x64.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "faos-cli-windows-x64.exe"
          $checksum = "$asset.sha256"
          $hash = ((Get-Content $checksum -Raw).Trim() -split "\s+")[0]
          $notesLines = @(
            "# FAOS CLI $tag",
            "",
            "Automated Windows release for $tag.",
            "",
            "## Assets",
            "",
            "- $asset",
            "- $checksum",
            "",
            "## SHA256",
            "",
            '```text',
            "$hash  $asset",
            '```',
            "",
            "Verify on Windows PowerShell:",
            "",
            '```powershell',
            "(Get-FileHash -Algorithm SHA256 .\$asset).Hash.ToLowerInvariant()",
            '```'
          )
          $notesLines | Set-Content -Encoding utf8 release-notes.md

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset $checksum --clobber
            gh release edit $tag --title "FAOS CLI $tag" --notes-file release-notes.md
          } else {
            gh release create $tag $asset $checksum --title "FAOS CLI $tag" --notes-file release-notes.md
          }
