name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Build release executable
        run: cargo build --release

      - name: Prepare release asset
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/faos-cli.exe -DestinationPath faos-cli-windows-x64.zip

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: faos-cli-windows-x64
          path: faos-cli-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "faos-cli-windows-x64.zip"
          $notesLines = @(
            "# FAOS CLI $tag",
            "",
            "## 中文",
            "",
            "FAOS CLI $tag 自动发布。",
            "",
            "这是一个命令行工具，用于与 FAOS 系统交互。",
            "",
            "## English",
            "",
            "FAOS CLI $tag automated release.",
            "",
            "This is a command-line tool for interacting with the FAOS system."
          )
          $notesLines | Set-Content -Encoding utf8 release-notes.md

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
            gh release edit $tag --title "FAOS CLI $tag" --notes-file release-notes.md
          } else {
            gh release create $tag $asset --title "FAOS CLI $tag" --notes-file release-notes.md
          }
